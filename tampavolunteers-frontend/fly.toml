# Fly.io app configuration for the frontend (Nginx serving the Vite build).
# Deploy from this directory with: fly deploy
# See ../fly/README.md for full setup instructions.

app = "tampavolunteers-frontend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.prod"

  [build.args]
    VITE_API_BASE_URL = "/api"
    VITE_APP_NAME = "Tampa Volunteers"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
