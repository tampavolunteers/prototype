# Fly.io app configuration for the Spring Boot backend.
# Deploy from this directory with: fly deploy
# See ../fly/README.md for full setup instructions (Postgres, secrets, etc).

app = "tampavolunteers-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Non-secret configuration. Secrets (SPRING_DATASOURCE_*, JWT_SECRET,
# GOOGLE_CLIENT_*, GITHUB_CLIENT_*) are set with `fly secrets set` -
# see fly/setup-fly.sh.
[env]
  SPRING_PROFILES_ACTIVE = "prod"
  # Migrations run once via the release_command below.
  SPRING_FLYWAY_ENABLED = "false"
  CORS_ALLOWED_ORIGINS = "https://tampavolunteers-frontend.fly.dev"
  APP_FRONTEND_URL = "https://tampavolunteers-frontend.fly.dev"

# Runs once per deploy, before new machines start - replaces the
# wait-for-db/flyway-migrate init container used on OpenShift.
[deploy]
  release_command = "java -jar /app/app.jar --spring.main.web-application-type=none --spring.main.lazy-initialization=true --spring.flyway.enabled=true --spring.jpa.hibernate.ddl-auto=none --spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/actuator/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
