# Test profile overrides — provides required secrets and switches to H2
jwt.secret=test-secret-key-for-testing-only-minimum-256-bits-long-abcdefghijklmnop
jwt.expiration=3600000

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Disable OAuth2 auto-config for tests
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret

cors.allowed-origins=http://localhost:5173
app.frontend-url=http://localhost:5173
