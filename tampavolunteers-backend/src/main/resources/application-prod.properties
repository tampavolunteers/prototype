# Production Profile
spring.jpa.show-sql=false
logging.level.org.tampavolunteers=INFO
logging.level.org.springframework=WARN

# Trust X-Forwarded-Proto/Host from Fly proxy + nginx so OAuth2 redirect URIs use https
server.forward-headers-strategy=native
# Only trust forwarded headers from Fly private network (proxy IPv4 + 6PN IPv6 from nginx)
server.tomcat.remoteip.internal-proxies=172\\.16\\.\\d{1,3}\\.\\d{1,3}|fdaa:.*
