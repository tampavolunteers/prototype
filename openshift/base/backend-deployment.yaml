apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tampavolunteers
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tampavolunteers-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: tampavolunteers-platform
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/tampavolunteers/prototype/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: tampavolunteers-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/tampavolunteers"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: tampavolunteers-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tampavolunteers-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tampavolunteers-secrets
                  key: JWT_SECRET
            # Google OAuth2
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tampavolunteers-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tampavolunteers-secrets
                  key: GOOGLE_CLIENT_SECRET
            # GitHub OAuth2
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tampavolunteers-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tampavolunteers-secrets
                  key: GITHUB_CLIENT_SECRET
            # CORS configuration - update with your actual frontend URL
            - name: CORS_ALLOWED_ORIGINS
              value: "https://frontend-tampavolunteers.apps.your-cluster.com"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
