apiVersion: v1
kind: ConfigMap
metadata:
  name: tampavolunteers-config
  namespace: tampavolunteers
  labels:
    app.kubernetes.io/name: tampavolunteers
    app.kubernetes.io/part-of: tampavolunteers-platform
data:
  # Database configuration
  POSTGRES_DB: "tampavolunteers"
  POSTGRES_USER: "postgres"

  # Backend configuration
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

  # Frontend configuration
  VITE_APP_NAME: "Tampa Volunteers"
