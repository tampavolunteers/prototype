apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: tampavolunteers
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: tampavolunteers-platform
spec:
  # OpenShift will auto-generate the hostname if not specified
  # Uncomment and set for custom hostname:
  # host: tampavolunteers.example.com
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
