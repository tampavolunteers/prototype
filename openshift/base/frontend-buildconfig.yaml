apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: frontend
  namespace: tampavolunteers
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: tampavolunteers-platform
spec:
  output:
    to:
      kind: ImageStreamTag
      name: frontend:latest
  source:
    type: Git
    git:
      # Update with your repository URL
      uri: https://github.com/tampavolunteers/prototype.git
      ref: main
    contextDir: tampavolunteers-frontend
    sourceSecret:
      name: github-credentials
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.prod
  triggers:
    - type: ConfigChange
    - type: ImageChange
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: frontend
  namespace: tampavolunteers
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: tampavolunteers-platform
spec:
  lookupPolicy:
    local: true
