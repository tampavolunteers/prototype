apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
  namespace: tampavolunteers
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tampavolunteers-platform
spec:
  # OpenShift will auto-generate the hostname if not specified
  # Uncomment and set for custom hostname:
  # host: api.tampavolunteers.example.com
  path: /api
  to:
    kind: Service
    name: backend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
