apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: tampavolunteers
  labels:
    app.kubernetes.io/part-of: tampavolunteers-platform
type: kubernetes.io/dockerconfigjson
data:
  # This is a placeholder. The actual secret should be created via:
  # oc create secret docker-registry ghcr-pull-secret \
  #   --docker-server=ghcr.io \
  #   --docker-username=<github-username> \
  #   --docker-password=<github-pat> \
  #   --docker-email=<email>
  # Or via the setup-openshift.sh script
  .dockerconfigjson: e30=
