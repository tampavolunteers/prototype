services:
  postgres:
    image: postgres:15-alpine
    container_name: tampavolunteers-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tampavolunteers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tampavolunteers-network

  backend:
    build:
      context: ./tampavolunteers-backend
      dockerfile: Dockerfile
    container_name: tampavolunteers-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tampavolunteers
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: your-secret-key-change-in-production-minimum-256-bits
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tampavolunteers-network
    volumes:
      # Mount source for hot reload in development
      - ./tampavolunteers-backend/src:/app/src:ro

  frontend:
    build:
      context: ./tampavolunteers-frontend
      dockerfile: Dockerfile
    container_name: tampavolunteers-frontend
    restart: unless-stopped
    environment:
      DOCKER_ENV: "true"
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - tampavolunteers-network
    volumes:
      # Mount source code for hot reload
      - ./tampavolunteers-frontend/src:/app/src
      - ./tampavolunteers-frontend/public:/app/public
      - ./tampavolunteers-frontend/index.html:/app/index.html
      - ./tampavolunteers-frontend/vite.config.js:/app/vite.config.js
      # Prevent overwriting node_modules
      - /app/node_modules

  # Optional: pgAdmin for database management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tampavolunteers-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tampavolunteers.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - tampavolunteers-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  tampavolunteers-network:
    driver: bridge
